# Runs every test on GitHub each time code is pushed to main or a pull request is opened.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Uses the local development settings, same as running the tests on your own computer.
      DJANGO_DEBUG: "True"

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.3 coverage==7.17.0

      - name: Check the code for mistakes
        run: ruff check --select E4,E7,E9,F --exclude pokedata/migrations .

      - name: Check the project for problems
        run: python manage.py check

      - name: Check the models match the migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect the static files
        run: python manage.py collectstatic --noinput
        
      - name: Run tests
        run: coverage run --source=pokedata --omit="pokedata/migrations/*,pokedata/tests.py" manage.py test --verbosity 2

      - name: Show how much of the code the tests cover
        run: |
          coverage report
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"